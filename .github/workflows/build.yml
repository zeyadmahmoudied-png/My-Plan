# My Plan — CI: JVM tests + Emulator instrumented tests + Debug APK
# Produces a DEBUG APK only. Not production-signed.
name: Build My Plan (Debug)

on:
  workflow_dispatch:
  push:
    branches: [main, master, work, develop, "ci/g5-runtime-validation"]

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ci/run-jvm-unit-tests.sh ]; then
            bash ci/run-jvm-unit-tests.sh
          else
            echo "ci/run-jvm-unit-tests.sh missing"
            exit 1
          fi

      - name: Upload JVM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-unit-test-log
          path: |
            **/TEST-*.txt
            jvm-test-results.txt
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Android Emulator instrumented tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK cmdline-tools not found on runner"
            exit 1
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-30;google_apis;x86_64"

      - name: local.properties (no production secrets required)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_HOME}"
            if [ -n "${SUPABASE_URL:-}" ]; then echo "supabase.url=${SUPABASE_URL}"; else echo "supabase.url=https://example.supabase.co"; fi
            if [ -n "${SUPABASE_ANON_KEY:-}" ]; then echo "supabase.anonKey=${SUPABASE_ANON_KEY}"; else echo "supabase.anonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test"; fi
          } > local.properties
          echo "Wrote local.properties"

      - name: AVD + connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 2048M
          heap-size: 512M
          script: |
            set -euo pipefail
            chmod +x ./gradlew || true
            ./gradlew :app:connectedDebugAndroidTest \
              --no-daemon \
              --no-parallel \
              --max-workers=1 \
              --stacktrace

      - name: Collect instrumented test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/instrumented
          cp -r app/build/outputs/androidTest artifacts/instrumented/ 2>/dev/null || true
          cp -r app/build/reports artifacts/instrumented/reports 2>/dev/null || true

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: artifacts/instrumented/
          if-no-files-found: ignore
          retention-days: 14

  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: [unit-tests, instrumented-tests]
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK cmdline-tools not found on runner"
            exit 1
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: local.properties (no secrets required for debug)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_HOME}"
            if [ -n "${SUPABASE_URL:-}" ]; then echo "supabase.url=${SUPABASE_URL}"; fi
            if [ -n "${SUPABASE_ANON_KEY:-}" ]; then echo "supabase.anonKey=${SUPABASE_ANON_KEY}"; fi
          } > local.properties
          echo "Wrote local.properties (sdk.dir set; secrets optional)"

      - name: Verify no keystore secrets in tree
        shell: bash
        run: |
          set -euo pipefail
          if find . -iname '*.jks' -o -iname '*.keystore' | grep -q .; then
            echo "ERROR: keystore file present in source tree"
            exit 1
          fi
          if [ -f keystore.properties ] || [ -f keystore/keystore.properties ]; then
            echo "ERROR: keystore.properties must not be committed"
            exit 1
          fi
          echo "OK: no keystore artifacts in tree"

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK missing: $APK"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/MyPlan-v2.41.3-debug.apk
          ls -lh artifacts/MyPlan-v2.41.3-debug.apk
          sha256sum artifacts/MyPlan-v2.41.3-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPlan-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
