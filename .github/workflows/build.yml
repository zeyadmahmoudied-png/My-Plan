# My Plan — CI via uploaded source ZIP
# 1) Upload MyPlan-v2.41.3-g5-runtime-tests-source.zip to this branch (web UI)
# 2) This workflow extracts it and runs JVM + Emulator instrumented + assembleDebug
name: Build My Plan (Debug)

on:
  workflow_dispatch:
  push:
    branches: [main, master, work, develop, "ci/g5-runtime-validation"]

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for c in MyPlan-v2.41.3-g5-runtime-tests-source.zip MyPlan-g5-runtime-tests-source.zip; do
            if [ -f "$c" ]; then ZIP="$c"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -1 *g5*runtime*.zip 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "${ZIP:-}" ] && [ -f "$ZIP" ]; then
            echo "Found source archive: $ZIP"
            sha256sum "$ZIP" || true
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            # If ZIP has a single top-level folder, flatten; else use _src as root
            if [ "$(find _src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find _src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
              TOP="$(find _src -mindepth 1 -maxdepth 1 -type d | head -n1)"
              rsync -a "$TOP"/ ./
            else
              rsync -a _src/ ./
            fi
            rm -rf _src
            echo "Extracted tree (top):"
            ls -la | head -40
          else
            echo "No source ZIP on branch — using checked-out files only"
            ls -la | head -40
          fi
          test -f ci/run-jvm-unit-tests.sh || { echo "ERROR: ci/run-jvm-unit-tests.sh missing after extract"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash ci/run-jvm-unit-tests.sh

      - name: Upload JVM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-unit-test-log
          path: |
            **/TEST-*.txt
            jvm-test-results.txt
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Android Emulator instrumented tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for c in MyPlan-v2.41.3-g5-runtime-tests-source.zip MyPlan-g5-runtime-tests-source.zip; do
            if [ -f "$c" ]; then ZIP="$c"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -1 *g5*runtime*.zip 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "${ZIP:-}" ] && [ -f "$ZIP" ]; then
            echo "Found source archive: $ZIP"
            sha256sum "$ZIP" || true
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            if [ "$(find _src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find _src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
              TOP="$(find _src -mindepth 1 -maxdepth 1 -type d | head -n1)"
              rsync -a "$TOP"/ ./
            else
              rsync -a _src/ ./
            fi
            rm -rf _src
          fi
          test -f gradlew || test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: Gradle project missing after extract"
            ls -la
            exit 1
          }
          chmod +x gradlew 2>/dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK cmdline-tools not found"; exit 1
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "emulator" "system-images;android-30;google_apis;x86_64"

      - name: local.properties
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_HOME}"
            if [ -n "${SUPABASE_URL:-}" ]; then echo "supabase.url=${SUPABASE_URL}"; else echo "supabase.url=https://example.supabase.co"; fi
            if [ -n "${SUPABASE_ANON_KEY:-}" ]; then echo "supabase.anonKey=${SUPABASE_ANON_KEY}"; else echo "supabase.anonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test"; fi
          } > local.properties

      - name: AVD + connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 2048M
          heap-size: 512M
          script: |
            set -euo pipefail
            chmod +x ./gradlew || true
            ./gradlew :app:connectedDebugAndroidTest \
              --no-daemon --no-parallel --max-workers=1 --stacktrace

      - name: Collect instrumented results
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/instrumented
          cp -r app/build/outputs/androidTest artifacts/instrumented/ 2>/dev/null || true
          cp -r app/build/reports artifacts/instrumented/reports 2>/dev/null || true

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: artifacts/instrumented/
          if-no-files-found: ignore
          retention-days: 14

  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: [unit-tests, instrumented-tests]
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for c in MyPlan-v2.41.3-g5-runtime-tests-source.zip MyPlan-g5-runtime-tests-source.zip; do
            if [ -f "$c" ]; then ZIP="$c"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -1 *g5*runtime*.zip 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "${ZIP:-}" ] && [ -f "$ZIP" ]; then
            echo "Found source archive: $ZIP"
            sha256sum "$ZIP" || true
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            if [ "$(find _src -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find _src -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
              TOP="$(find _src -mindepth 1 -maxdepth 1 -type d | head -n1)"
              rsync -a "$TOP"/ ./
            else
              rsync -a _src/ ./
            fi
            rm -rf _src
          fi
          chmod +x gradlew 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: local.properties
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_HOME}"
            if [ -n "${SUPABASE_URL:-}" ]; then echo "supabase.url=${SUPABASE_URL}"; fi
            if [ -n "${SUPABASE_ANON_KEY:-}" ]; then echo "supabase.anonKey=${SUPABASE_ANON_KEY}"; fi
          } > local.properties

      - name: Verify no keystore secrets
        shell: bash
        run: |
          set -euo pipefail
          if find . -iname '*.jks' -o -iname '*.keystore' | grep -q .; then
            echo "ERROR: keystore present"; exit 1
          fi
          echo "OK: no keystore"

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug --no-daemon --no-parallel --max-workers=1 --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK missing"; find app/build/outputs -type f 2>/dev/null || true; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/MyPlan-v2.41.3-g5-debug.apk
          ls -lh artifacts/MyPlan-v2.41.3-g5-debug.apk
          sha256sum artifacts/MyPlan-v2.41.3-g5-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPlan-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
