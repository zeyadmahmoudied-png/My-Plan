# Tuned for GitHub-hosted runners (~7GB RAM). For low-RAM local hosts, override:
#   GRADLE_OPTS="-Xmx512m -XX:MaxMetaspaceSize=192m" and lower org.gradle.jvmargs similarly.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
android.enableJetifier=false
systemProp.file.encoding=UTF-8
